# ===================================================================
# CONFIGURACIÓN NGINX NATIVO PARA LA VPS
# Dominio API & WebSockets: api-hackeados.geislera.com
# ===================================================================

server {
    server_name api-hackeados.geislera.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Cabeceras requeridas para WebSockets (Socket.io)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cabeceras estándar de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para conexiones de juego en vivo
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Certbot agregará automáticamente los bloques SSL después de ejecutar:
    # sudo certbot --nginx -d api-hackeados.geislera.com
}
