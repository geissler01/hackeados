name: CI/CD Deploy - Hackeados

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Compilar Backend (NestJS)
        run: |
          cd backend
          npm install
          npm run build

      - name: Compilar Frontend (Angular)
        run: |
          cd frontend
          npm install
          npm run build

  deploy-vps:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Desplegar en VPS Lightsail vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/hackeados
            git pull origin main
            # Despliega solo el backend sin reiniciar la base de datos
            docker compose -f docker-compose.app.yml up -d --build backend
